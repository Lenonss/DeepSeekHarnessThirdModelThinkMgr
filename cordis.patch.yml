# dsh-thinking-intensity bundle patch: inserts the dual-face plugin row into
# the web profile roster. Applied as a profile bundle layer (the
# `dsh.bundle.patch` manifest field) over dsh-base; activate with
# `dsh plugin --profile <name> add link:<path/to/packages/dsh-thinking-intensity>`.
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (the system-prompt announcement section), and the
# `dsh.client` declaration in package.json makes the browser half
# (exports "./client", served at /plugins/<id>/client.js) load in the web GUI.
- insert:
    - id: thinking-intensity
      name: 'dsh-thinking-intensity'
